<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEST Aceitera y Mecánica Rápida — Sistema de Gestión</title>
<link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body>

  <!-- LOGIN -->
  <div id="login-view" class="login-screen">
    <form id="login-form" class="login-card">
      <img class="login-logo" src="assets/logo.jpg" alt="BEST Aceitera y Mecánica Rápida">
      <p class="login-sub">Sistema de gestión</p>
      <label>Usuario
        <input type="text" id="login-username" autocomplete="username" required>
      </label>
      <label>Contraseña
        <input type="password" id="login-password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      <p id="login-error" class="login-error" hidden></p>
    </form>
  </div>

  <!-- APP -->
  <div id="app-view" class="app-shell" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand"><img src="assets/logo.jpg" alt="BEST"></div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div id="sidebar-user" class="sidebar-user"></div>
        <button id="btn-logout" class="btn btn-ghost btn-block">Cerrar sesión</button>
      </div>
    </aside>
    <div class="main-wrap">
      <header class="topbar">
        <button id="btn-menu" class="btn-icon" aria-label="Menú">☰</button>
        <h2 id="page-title">Dashboard</h2>
        <div id="stock-alert-badge" class="alert-badge" hidden></div>
      </header>
      <main id="main-content" class="main-content"></main>
    </div>
  </div>

  <!-- MODAL -->
  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div id="modal-box" class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button id="modal-close" class="btn-icon">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- TOASTS -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Librerías de exportación (PDF / Excel) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
