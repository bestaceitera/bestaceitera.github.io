<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEST Aceitera y Mecánica Rápida — Sistema de Gestión</title>
<link rel="stylesheet" href="css/styles.css?v=16">
<link rel="stylesheet" href="css/operacion.css?v=16">
</head>
<body>

  <!-- LOGIN -->
  <div id="login-view" class="login-screen">
    <form id="login-form" class="login-card">
      <img class="login-logo" src="assets/logo.jpg" alt="BEST Aceitera y Mecánica Rápida">
      <p class="login-sub">Sistema de gestión</p>
      <label>Usuario
        <input type="text" id="login-username" autocomplete="username" required>
      </label>
      <label>Contraseña
        <input type="password" id="login-password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      <p id="login-error" class="login-error" hidden></p>
    </form>
  </div>

  <!-- APP -->
  <div id="app-view" class="app-shell" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand"><img src="assets/logo.jpg" alt="BEST"></div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div id="sidebar-user" class="sidebar-user"></div>
        <button id="btn-logout" class="btn btn-ghost btn-block">Cerrar sesión</button>
      </div>
    </aside>
    <div class="main-wrap">
      <header class="topbar">
        <button id="btn-menu" class="btn-icon" aria-label="Menú">☰</button>
        <h2 id="page-title">Dashboard</h2>
        <div id="stock-alert-badge" class="alert-badge" hidden></div>
      </header>
      <!-- Aviso de que no hay internet: sin él, las pantallas se verían vacías
           y parecería que se borraron los datos. -->
      <div id="sin-conexion" class="sin-conexion" hidden>
        📡 <b>Sin conexión a internet.</b> Estás viendo la última información guardada.
        No se pueden registrar ventas hasta que vuelva la señal.
      </div>
      <main id="main-content" class="main-content"></main>
    </div>
  </div>

  <!-- MODAL -->
  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div id="modal-box" class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button id="modal-close" class="btn-icon">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- TOASTS -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Las librerías de exportación (PDF / Excel) NO se cargan aquí a propósito.
       Pesan ~290 KB y frenaban el arranque de todos los días para algo que solo
       se usa al pedir un reporte. js/export.js las baja la primera vez que se
       toca un botón de exportar. -->

  <script type="module" src="js/app.js?v=16"></script>
</body>
</html>
